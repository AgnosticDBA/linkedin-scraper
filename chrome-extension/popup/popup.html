<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body {
            width: 350px;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
        }
        
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .header h1 {
            color: #0073b1;
            font-size: 18px;
            margin: 0;
        }
        
        .status {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .status-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        
        .status-item:last-child {
            margin-bottom: 0;
        }
        
        .status-label {
            font-weight: 500;
            color: #333;
        }
        
        .status-value {
            color: #666;
        }
        
        .button {
            width: 100%;
            padding: 12px;
            background: #0073b1;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            margin-bottom: 10px;
            transition: background 0.2s ease;
        }
        
        .button:hover {
            background: #005885;
        }
        
        .button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .button.secondary {
            background: #f3f2ef;
            color: #333;
        }
        
        .button.secondary:hover {
            background: #e6e4df;
        }
        
        .settings {
            border-top: 1px solid #e6e4df;
            padding-top: 15px;
            margin-top: 15px;
        }
        
        .setting-group {
            margin-bottom: 15px;
        }
        
        .setting-label {
            display: block;
            font-weight: 500;
            margin-bottom: 5px;
            color: #333;
        }
        
        .setting-input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            box-sizing: border-box;
        }
        
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .checkbox-group input[type="checkbox"] {
            margin: 0;
        }
        
        .help-text {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }
        
        .error {
            color: #e74c3c;
            font-size: 12px;
            margin-top: 5px;
        }
        
        .success {
            color: #27ae60;
            font-size: 12px;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📊 LinkedIn Feed Scraper</h1>
    </div>
    
    <div class="status" id="status">
        <div class="status-item">
            <span class="status-label">Status:</span>
            <span class="status-value" id="scraping-status">Ready</span>
        </div>
        <div class="status-item">
            <span class="status-label">Posts Found:</span>
            <span class="status-value" id="posts-count">0</span>
        </div>
        <div class="status-item">
            <span class="status-label">Page:</span>
            <span class="status-value" id="current-page">Not LinkedIn</span>
        </div>
    </div>
    
    <button class="button" id="scrape-button">
        🚀 Start Scraping
    </button>
    
    <button class="button secondary" id="settings-toggle">
        ⚙️ Settings
    </button>
    
    <div class="settings" id="settings" style="display: none;">
        <div class="setting-group">
            <label class="setting-label" for="webhook-url">Webhook URL:</label>
            <input type="text" id="webhook-url" class="setting-input" 
                   placeholder="http://localhost:3000/webhook/linkedin-feed">
            <div class="help-text">URL where scraped data will be sent</div>
        </div>
        
        <div class="setting-group">
            <label class="setting-label" for="max-posts">Max Posts:</label>
            <input type="number" id="max-posts" class="setting-input" 
                   min="1" max="100" value="25">
            <div class="help-text">Maximum number of posts to scrape</div>
        </div>
        
        <div class="setting-group">
            <div class="checkbox-group">
                <input type="checkbox" id="auto-scrape">
                <label class="setting-label" for="auto-scrape">Auto-scrape on page load</label>
            </div>
            <div class="help-text">Automatically start scraping when LinkedIn feed loads</div>
        </div>
        
        <div class="setting-group">
            <div class="checkbox-group">
                <input type="checkbox" id="bear-integration">
                <label class="setting-label" for="bear-integration">Send to Bear notes</label>
            </div>
            <div class="help-text">Automatically create Bear notes from LinkedIn posts</div>
        </div>
        
        <button class="button" id="save-settings">
            💾 Save Settings
        </button>
        
        <div id="settings-message"></div>
    </div>
    
    <script src="popup.js"></script>
</body>
</html>
